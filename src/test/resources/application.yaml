# The datasource comes from the Postgres Testcontainer in TestcontainersConfiguration.
spring:
  flyway:
    default-schema: public
    locations: classpath:db/schema

  security:
    jwt:
      secret-key: 12345
      expiration-time: 3600000

  logging:
    level:
      org.flywaydb: info
  quartz:
    auto-startup: false
